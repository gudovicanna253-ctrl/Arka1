<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;background:#0a0a0a;color:#e8e8e8;min-height:100vh}
#header{position:sticky;top:0;z-index:100;background:#111;border-bottom:1px solid #333;padding:8px}

#ticket-bar{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}

#content{padding:8px}
.ticket-block{margin-bottom:16px;background:#161616;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden}

.ticket-header:hover{background:#252525}
.ticket-questions{padding:0}
.q-block{border-top:1px solid #222;padding:10px 12px}
.q-title{font-size:12px;font-weight:600;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.q-code{display:inline-block;background:#2a3a4a;color:#4a9eff;font-size:11px;padding:2px 6px;border-radius:4px;margin-right:6px}
.q-text{font-size:13px;line-height:1.6;color:#ccc}
.q-text strong{color:#fff}
.q-text ul{margin:4px 0 4px 16px}
.q-text li{margin-bottom:2px}
.q-text .key{background:#1a2a1a;border-left:2px solid #3a8;padding:4px 8px;margin:4px 0;border-radius:0 4px 4px 0;font-size:12px;color:#8dc;display:block}
.q-text .law{background:#1a1a2a;border-left:2px solid #44f;padding:3px 7px;margin:3px 0;border-radius:0 3px 3px 0;font-size:11px;color:#88f;display:block}
.hidden{display:none}
.collapsed .ticket-questions{display:none}
.mark{background:#4a9eff33;border-radius:2px;color:#7bc4ff}
#stats{font-size:11px;color:#555;padding:4px 8px}

/* Watch mode */
#watchbtn{position:fixed;bottom:16px;right:16px;width:48px;height:48px;border-radius:50%;background:#4a9eff;border:none;color:#fff;font-size:20px;cursor:pointer;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
#watchmode{display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column;align-items:center;justify-content:center;padding:12px}
#watchmode.show{display:flex}
#wcard{width:100%;max-width:360px;text-align:center}
#wq{font-size:12px;color:#666;margin-bottom:8px}
#wans{font-size:15px;line-height:1.5;color:#e8e8e8;max-height:70vh;overflow-y:auto;padding:0 4px}
#wans .key{background:#1a2a1a;border-left:2px solid #3a8;padding:4px 8px;margin:6px 0;text-align:left;font-size:13px;color:#8dc;display:block;border-radius:0 4px 4px 0}
#wans strong{color:#fff}
#wnav{display:flex;gap:12px;margin-top:16px;justify-content:center}
#wnav button{padding:10px 20px;background:#222;border:1px solid #444;border-radius:8px;color:#ccc;font-size:14px;cursor:pointer}
#wnav button:hover{background:#333}
#wclosenav{margin-top:12px}
#wclosenav button{padding:8px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#666;font-size:12px;cursor:pointer}
#wpicker{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.wpbtn{padding:6px 12px;background:#1e1e1e;border:1px solid #333;border-radius:6px;color:#aaa;font-size:13px;cursor:pointer}
.wpbtn:hover{background:#4a9eff;color:#fff;border-color:#4a9eff}
#wstep{font-size:11px;color:#444;margin-top:8px;text-align:center}
</style>
</head>

let currentFilter = 0;
let watchIdx = 0;
let watchList = [];

function renderTicketBar() {
  const bar = document.getElementById('ticket-bar');
  for (let i = 1; i <= 26; i++) {
    const btn = document.createElement('div');
    btn.className = 'tbtn';
    btn.textContent = 'Б' + i;
    btn.onclick = function() { filterTicket(i, this); };
    bar.appendChild(btn);
  }
}

function getAnswerCodes(ticketNum) {
  if (ticketNum === 0) return null;
  const t = DATA.tickets.find(t => t.n === ticketNum);
  return t ? [t.q1, t.q2] : null;
}

function renderContent(searchQ, ticketFilter) {
  const content = document.getElementById('content');
  const q = (searchQ || '').toLowerCase().trim();
  
  if (ticketFilter > 0) {
    const codes = getAnswerCodes(ticketFilter);
    const t = DATA.tickets.find(t => t.n === ticketFilter);
    content.innerHTML = '';
    if (!codes) return;
    const block = document.createElement('div');
    block.className = 'ticket-block';
    block.innerHTML = `<div class="ticket-header">📋 Билет ${ticketFilter} — ${t.q1} и ${t.q2}</div><div class="ticket-questions">`;
    codes.forEach((code, idx) => {
      const ans = DATA.answers[code];
      if (!ans) return;
      block.innerHTML += `<div class="q-block"><div class="q-title">Вопрос ${idx+1} <span class="q-code">${code}</span>${ans.title}</div><div class="q-text">${ans.short}</div></div>`;
    });
    block.innerHTML += '</div>';
    content.appendChild(block);
    updateStats(codes.length);
    return;
  }
  
  if (q.length < 1) {
    renderAllTickets(null);
    return;
  }
  
  content.innerHTML = '';
  let found = 0;
  
  const ticketMatch = q.match(/^б?[иилет]*(\d+)$/) || q.match(/^билет\s*(\d+)$/);
  if (ticketMatch) {
    const num = parseInt(ticketMatch[1]);
    if (num >= 1 && num <= 26) {
      filterTicket(num, null);
      return;
    }
  }
  
  Object.entries(DATA.answers).forEach(([code, ans]) => {
    const searchText = (code + ' ' + ans.title + ' ' + ans.short).toLowerCase();
    if (searchText.includes(q)) {
      found++;
      const block = document.createElement('div');
      block.className = 'ticket-block';
      const billets = DATA.tickets.filter(t => t.q1 === code || t.q2 === code).map(t => 'Б'+t.n).join(', ');
      block.innerHTML = `<div class="ticket-header"><span><span class="q-code">${code}</span> ${ans.title}</span><span style="font-size:11px;color:#666">${billets}</span></div><div class="ticket-questions"><div class="q-block"><div class="q-text">${highlight(ans.short, q)}</div></div></div>`;
      content.appendChild(block);
    }
  });
  
  updateStats(found, q);
}

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<mark class="mark">$1</mark>');
}

function renderAllTickets(q) {
  const content = document.getElementById('content');
  content.innerHTML = '';
  
  DATA.tickets.forEach(t => {
    const block = document.createElement('div');
    block.className = 'ticket-block collapsed';
    block.innerHTML = `<div class="ticket-header" onclick="toggleTicket(this)"><span>📋 Билет ${t.n}</span><span style="font-size:11px;color:#666">${t.q1} + ${t.q2}</span></div><div class="ticket-questions">`;
    
    [t.q1, t.q2].forEach((code, idx) => {
      const ans = DATA.answers[code];
      if (!ans) return;
      block.innerHTML += `<div class="q-block"><div class="q-title">Вопрос ${idx+1} <span class="q-code">${code}</span>${ans.title}</div><div class="q-text">${ans.short}</div></div>`;
    });
    block.innerHTML += '</div>';
    content.appendChild(block);
  });
  updateStats(26);
}

function toggleTicket(el) {
  el.parentElement.classList.toggle('collapsed');
}

function filterTicket(num, btn) {
  currentFilter = num;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    const btns = document.querySelectorAll('.tbtn');
    if (num === 0 && btns.length > 0) btns[0].classList.add('active');
  }
  document.getElementById('search').value = '';
  renderContent('', num);
}

function doSearch() {
  const q = document.getElementById('search').value;
  currentFilter = 0;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tbtn')[0]?.classList.add('active');
  renderContent(q, 0);
}

function updateStats(count, q) {
  const s = document.getElementById('stats');
  if (q) {
    s.textContent = `Найдено: ${count} тем по запросу «${q}»`;
  } else if (count) {
    s.textContent = currentFilter > 0 ? `Билет ${currentFilter}` : `Всего билетов: ${count}`;
  } else {
    s.textContent = '';
  }
}

function openWatch() {
  buildWatchList();
  document.getElementById('watchmode').classList.add('show');
  renderWatchPicker();
}

function closeWatch() {
  document.getElementById('watchmode').classList.remove('show');
}

function buildWatchList(ticketNum) {
  watchList = [];
  if (ticketNum) {
    const t = DATA.tickets.find(t => t.n === ticketNum);
    if (t) {
      [t.q1, t.q2].forEach((code, idx) => {
        const ans = DATA.answers[code];
        if (ans) watchList.push({code, title: ans.title, text: ans.short, qnum: idx+1, ticket: ticketNum});
      });
    }
  } else {
    Object.entries(DATA.answers).forEach(([code, ans]) => {
      watchList.push({code, title: ans.title, text: ans.short});
    });
  }
  watchIdx = 0;
}

function renderWatchPicker() {
  const picker = document.getElementById('wpicker');
  picker.innerHTML = '<div style="color:#555;font-size:12px;width:100%;text-align:center;margin-bottom:4px">Выбери билет:</div>';
  for (let i = 1; i <= 26; i++) {
    const btn = document.createElement('div');
    btn.className = 'wpbtn';
    btn.textContent = 'Б' + i;
    const n = i;
    btn.onclick = function() {
      buildWatchList(n);
      renderWatchCard();
      picker.style.display = 'none';
    };
    picker.appendChild(btn);
  }
}

function renderWatchCard() {
  if (!watchList.length) return;
  const item = watchList[watchIdx];
  const qEl = document.getElementById('wq');
  const ansEl = document.getElementById('wans');
  const stepEl = document.getElementById('wstep');
  
  qEl.innerHTML = item.ticket
    ? `Билет ${item.ticket} · Вопрос ${item.qnum} · <span style="color:#4a9eff">${item.code}</span>`
    : `<span style="color:#4a9eff">${item.code}</span>`;
  
  const titleHtml = `<div style="font-weight:600;color:#fff;margin-bottom:10px;font-size:15px">${item.title}</div>`;
  ansEl.innerHTML = titleHtml + item.text;
  stepEl.textContent = `${watchIdx + 1} / ${watchList.length}`;
}

function wNav(dir) {
  if (!watchList.length) return;
  watchIdx = (watchIdx + dir + watchList.length) % watchList.length;
  renderWatchCard();
}

renderTicketBar();
renderAllTickets(null);
</script>
</body>
